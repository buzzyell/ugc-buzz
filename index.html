<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UGCバズ帳</title>

<style>
:root{
  --bg:#f3f4f7; --surface:#fff; --ink:#15171c; --muted:#6a6f7b; --line:#dfe2e9;
  --accent:#ff2d6b; --accent-ink:#fff; --cyan:#0aa6b8; --cyan-soft:#dcf6f8; --player:#000;
  --f-body:"M PLUS 1p","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1115; --surface:#181b21; --ink:#eceef2; --muted:#9097a4; --line:#2a2f38;
  --accent:#ff4d82; --cyan:#3fd0e0; --cyan-soft:#12313a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(16px,3vw);display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{margin:0;font-size:20px;font-weight:800}
h1 span{color:var(--accent)}
.count{color:var(--muted);font-size:12px}
.spacer{flex:1}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:6px 12px}
.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#urls{flex:1;min-width:200px;height:38px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
#q,#sort{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
#q{flex:1;min-width:160px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-num);font-size:11px;opacity:.7;margin-left:4px}
.msg{font-size:12px;color:var(--cyan);min-height:1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px max(16px,3vw) 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.player{aspect-ratio:9/16;background:var(--player);position:relative;max-height:620px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;border-radius:0;background:#111 center/cover no-repeat;cursor:pointer;display:grid;place-items:center}
.cover .cv-cap{position:absolute;left:14px;right:14px;top:18px;color:#fff;font-size:15px;font-weight:700;line-height:1.5;text-align:left;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover .cv-wait{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;opacity:.5;font-size:11px}
.cover .pl{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:26px;display:grid;place-items:center;padding-left:4px}
.player .ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;opacity:.7;text-align:center;padding:20px}
.body{padding:12px;display:grid;gap:10px}
.who{font-weight:700;overflow-wrap:anywhere}
.who small{font-weight:400;color:var(--muted);margin-left:6px}
.cap{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere;max-height:3.2em;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--bg);border-radius:8px;padding:5px 7px}
.stat b{display:block;font-family:var(--f-num);font-size:13px;font-weight:500}
.stat span{font-size:10px;color:var(--muted)}
.stat.hi b{color:var(--accent)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted)}
.tag.on{border-style:solid;background:var(--cyan-soft);color:var(--cyan);border-color:var(--cyan);font-weight:700}
.tagadd{width:80px;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:transparent}
label{display:grid;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
textarea.memo{font-size:13px;font-weight:400;background:var(--bg);border:1px solid transparent;border-radius:8px;padding:7px 9px;min-height:70px;resize:vertical}
textarea.memo:focus{border-color:var(--line);background:var(--surface);outline:none}
details.cm{border:1px solid var(--line);border-radius:10px}
details.cm>summary{cursor:pointer;list-style:none;padding:7px 10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
details.cm>summary::-webkit-details-marker{display:none}
details.cm>summary::after{content:"▾";transition:transform .15s}
details.cm[open]>summary::after{transform:rotate(180deg)}
.cm ol{margin:0;padding:0 10px 10px 10px;list-style:none;display:grid;gap:6px}
.cm li{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:12.5px;line-height:1.5;align-items:start}
.cm .lk{font-family:var(--f-num);font-size:11px;color:var(--accent);background:var(--bg);border-radius:4px;padding:1px 6px;white-space:nowrap}
.cm .at{font-size:10.5px;color:var(--muted);padding:0 10px 8px}
details.ads{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
details.ads>summary{cursor:pointer;list-style:none;padding:7px 10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
details.ads>summary::-webkit-details-marker{display:none}
details.ads>summary::after{content:"▾";transition:transform .15s}
details.ads[open]>summary::after{transform:rotate(180deg)}
.ads .n{font-family:var(--f-num);color:var(--accent);margin-left:4px}
.ad-list{display:grid;gap:8px;padding:0 10px 10px}
.ad{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px}
.ad-h{display:flex;gap:6px;align-items:center}
.ad-h input{flex:1;min-width:0;font-size:13px;font-weight:700;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.ad-h button{font-size:11px;padding:3px 8px;color:var(--muted)}
.ad textarea{font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-height:64px;resize:vertical;width:100%}
.ad-add{font-size:12px;padding:5px;border-style:dashed;color:var(--muted);background:transparent}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:6px;flex-wrap:wrap}
.foot a{color:var(--cyan)}
.foot button{font-size:12px;padding:3px 10px}
.yes{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{font-size:11px;padding:1px 8px;border-radius:4px;background:var(--cyan-soft);color:var(--cyan);justify-self:start}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
</style>
</head>

  <div class="row"><h1>UGC<span>バズ</span>帳</h1><span class="count" id="count"></span><span class="spacer"></span>

  const c=COMMENTS[r.videoId];if(!c)return "";
  if(!c.c.length)return `<div class="cm" style="font-size:12px;color:var(--muted);padding:4px 2px">コメントなし（オフの可能性）</div>`;
  return `<details class="cm"${openCm.has(r.id)?" open":""}><summary><span>トップコメント <span style="font-weight:400">（全${c.n.toLocaleString()}件中・いいね順）</span></span></summary><ol>${c.c.map(([l,t])=>`<li><span class="lk">♥ ${fmt(l)}</span><span>${esc(t)}</span></li>`).join("")}</ol><div class="at">${COMMENTS_AT} 時点</div></details>`;
}
function adsHtml(r){
  const a=r.adIdeas||[];
  return `<details class="ads"${openAds.has(r.id)?" open":""}><summary><span>広告に使うなら<span class="n">${a.length?a.length+"件":""}</span></span></summary>
  <div class="ad-list">${a.map((x,i)=>`<div class="ad" data-i="${i}"><div class="ad-h"><input list="projects" data-ap="project" value="${esc(x.project)}" placeholder="案件名（例：雲パンツ）"><button data-addel>削除</button></div><textarea data-ap="memo" placeholder="差し込み方、キャスト条件、尺、CTAなど">${esc(x.memo)}</textarea></div>`).join("")}
  <button class="ad-add" data-adadd>＋ 案件を追加</button></div></details>`;
}
function refreshAds(card,r,focusLast){
  card.querySelector("details.ads").outerHTML=adsHtml(r);
  document.getElementById("projects").innerHTML=projects().map(p=>`<option value="${esc(p)}">`).join("");
  if(focusLast){const ins=card.querySelectorAll(".ad-h input");ins[ins.length-1]?.focus()}
}
let active=null;
const PLAYER=(vid,auto)=>`<iframe src="https://www.tiktok.com/player/v1/${vid}?${auto?"autoplay=1&":""}description=0&music_info=0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
function coverHtml(p){const r=rows.find(x=>x.videoId===p.dataset.vid)||{};return `<button class="cover" data-play aria-label="再生"><span class="cv-cap">${esc((r.caption||"").replace(/#\S+/g,"").trim()||"@"+(r.author||""))}</span><span class="pl">▶</span><span class="cv-wait">プレビュー待ち…</span></button>`}
function play(p){
  p.innerHTML=PLAYER(p.dataset.vid,true);p.dataset.loaded="1";active=p;
}
// プレビュー：画面に入った動画を1本ずつ間隔をあけて読み込む（一度に読むとTikTokにブロックされる）
let io,queue=[],busy=false,loaded=[];
const MAX_LOADED=8, GAP=2500;
function setupPreviews(){
  io&&io.disconnect();queue=[];loaded=[];busy=false;
  io=new IntersectionObserver(es=>es.forEach(e=>{const p=e.target;p._vis=e.isIntersecting;if(e.isIntersecting&&!p.dataset.loaded&&!queue.includes(p)){queue.push(p);pump()}}),{rootMargin:"200px 0px"});
  document.querySelectorAll(".player[data-vid]").forEach(p=>{if(p.dataset.vid)io.observe(p)});
}
async function pump(){
  if(busy)return;busy=true;
  while(queue.length){
    const p=queue.shift();
    if(!p.isConnected||p.dataset.loaded||!p._vis)continue;
    // 上限を超えたら画面外の古いプレビューを閉じる
    loaded=loaded.filter(x=>x.isConnected);
    while(loaded.length>=MAX_LOADED){const old=loaded.find(x=>!x._vis&&x!==active);if(!old)break;old.innerHTML=coverHtml(old);delete old.dataset.loaded;loaded=loaded.filter(x=>x!==old)}
    p.innerHTML=PLAYER(p.dataset.vid,false);p.dataset.loaded="1";loaded.push(p);
    await new Promise(res=>{const f=p.querySelector("iframe");let done=false;const fin=()=>{if(!done){done=true;res()}};f&&f.addEventListener("load",fin);setTimeout(fin,6000)});
    await new Promise(res=>setTimeout(res,GAP));
  }
  busy=false;
}
const find=el=>rows.find(r=>r.id===el.closest(".card").dataset.id);
$("#grid").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-play")){play(b.closest(".player"));return}const r=find(b);const card=b.closest(".card");
  if(b.hasAttribute("data-adadd")){r.adIdeas=[...(r.adIdeas||[]),{project:"",memo:""}];openAds.add(r.id);persist();refreshAds(card,r,true);return}
  if(b.hasAttribute("data-addel")){const i=+b.closest(".ad").dataset.i,x=r.adIdeas[i];
    if((x.project||x.memo)&&b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="本当に削除";b.classList.add("yes");return}
    r.adIdeas.splice(i,1);persist();refreshAds(card,r);return}
  if(b.dataset.tag){const s=new Set(r.tags||[]);s.has(b.dataset.tag)?s.delete(b.dataset.tag):s.add(b.dataset.tag);r.tags=[...s];persist();render()}
  else if(b.hasAttribute("data-del")){delPending=r.id;render()}
  else if(b.hasAttribute("data-delno")){delPending=null;render()}
  else if(b.hasAttribute("data-delok")){rows=rows.filter(x=>x!==r);delPending=null;persist();render();say("削除しました")}
});
$("#grid").addEventListener("input",e=>{const t=e.target;
  if(t.dataset.ap){const r=find(t),i=+t.closest(".ad").dataset.i;r.adIdeas[i][t.dataset.ap]=t.value;clearTimeout(t._t);t._t=setTimeout(persist,400);
    const n=t.closest("details").querySelector("summary .n");return}
  if(!t.dataset.f)return;find(t)[t.dataset.f]=t.value;clearTimeout(t._t);t._t=setTimeout(persist,400)});
$("#grid").addEventListener("keydown",e=>{const t=e.target;if(!t.classList.contains("tagadd")||e.key!=="Enter"||e.isComposing)return;const v=t.value.trim();if(!v)return;const r=find(t);r.tags=[...new Set([...(r.tags||[]),v])];persist();render()});
$("#grid").addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("cm")){const id=d.closest(".card").dataset.id;d.open?openCm.add(id):openCm.delete(id);return}if(!d.classList||!d.classList.contains("ads"))return;const id=d.closest(".card").dataset.id;d.open?openAds.add(id):openAds.delete(id)},true);
$("#grid").addEventListener("change",e=>{if(e.target.dataset.ap==="project")document.getElementById("projects").innerHTML=projects().map(p=>`<option value="${esc(p)}">`).join("")});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-clear"))filter.clear();else filter.has(b.dataset.f)?filter.delete(b.dataset.f):filter.add(b.dataset.f);render()});
$("#q").addEventListener("input",render);$("#sort").addEventListener("change",render);
$("#add").addEventListener("click",async()=>{
  const found=[...new Set($("#urls").value.match(/https?:\/\/[^\s<>"']*tiktok\.com\/[^\s<>"']+/g)||[])];
  if(!found.length){say("TikTokのURLが見つかりませんでした。");return}
  $("#add").disabled=true;let n=0,dup=0,miss=0;
  for(const u of found){
    let vid=(u.match(/\/video\/(\d+)/)||[])[1]||null,author=(u.match(/@([\w.\-]+)/)||[])[1]||null,caption="";
    if(!vid){try{const j=await(await fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(u))).json();vid=j.embed_product_id||null;author=j.author_unique_id||author;caption=j.title||""}catch(e){}}
    if(!vid)miss++;
    const id=vid?"v"+vid:u;
    if(rows.some(r=>r.url===u||(vid&&r.videoId===vid))){dup++;continue}
    rows.push({id,url:u,videoId:vid,author,caption,tags:[],buzzMemo:"",adIdeas:[],status:"ok",addedAt:Date.now()+n});n++;
  }
  persist();$("#urls").value="";$("#add").disabled=false;$("#sort").value="added";render();
  say(`${n}本追加しました`+(dup?`（重複${dup}本はスキップ）`:"")+(miss?`。${miss}本は動画IDが取れず、再生はTikTokで開く形になります`:""));
});
$("#exp").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,1)],{type:"application/json"}));a.download="ugc-buzz-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();say("バックアップを書き出しました")});
$("#impBtn").addEventListener("click",()=>$("#imp").click());
$("#imp").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;rows=d;persist();render();say(`${d.length}本を読み込みました`)}catch(x){say("読み込めませんでした。書き出したバックアップファイルを選んでください。")}e.target.value=""});
render();
</script>
</body>
</html>
