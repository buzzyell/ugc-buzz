<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UGCバズ帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f3f4f7; --surface:#fff; --ink:#15171c; --muted:#6a6f7b; --line:#dfe2e9;
  --accent:#ff2d6b; --cyan:#0aa6b8; --cyan-soft:#dcf6f8; --amber:#b86e00; --amber-soft:#fff1d6; --violet:#6b4ce0; --ok:#1a9a5a;
  --f-body:"M PLUS 1p","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1115; --surface:#181b21; --ink:#eceef2; --muted:#9097a4; --line:#2a2f38;
  --accent:#ff4d82; --cyan:#3fd0e0; --cyan-soft:#12313a; --amber:#f0b25a; --amber-soft:#3a2a10; --violet:#8f78ff; --ok:#4cd58c; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:6px 12px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(16px,3vw);display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{margin:0;font-size:20px;font-weight:800}
h1 span{color:var(--accent)}
.count{color:var(--muted);font-size:12px}
.spacer{flex:1}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--amber)} .sync.err i{background:var(--accent)}
#urls{flex:1;min-width:200px;height:38px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
#q,#sort,#catSel{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px}
#q{flex:1;min-width:160px}
.flabel{font-size:11px;font-weight:700;color:var(--muted);min-width:34px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-num);font-size:11px;opacity:.7;margin-left:4px}
.msg{font-size:12px;color:var(--cyan);min-height:1em}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:14px max(16px,3vw) 60px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.tile:hover{border-color:var(--ink)}
.tile.deleted{opacity:.5}
.pv{aspect-ratio:9/14;background:#111;position:relative;overflow:hidden}
.pv iframe{position:absolute;left:0;top:0;width:100%;height:calc(100% * 16 / 14);border:0;pointer-events:none}
.pv .hit{position:absolute;inset:0;z-index:2;background:transparent;border:0;border-radius:0;padding:0}
.pv .cv{position:absolute;inset:0;padding:14px;color:#fff;font-size:13px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.pv .wait{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;opacity:.5;font-size:11px}
.tb{padding:10px 11px;display:grid;gap:6px}
.who{font-weight:700;font-size:13px;overflow-wrap:anywhere;line-height:1.35}
.who small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.mini{display:flex;gap:10px;font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.mini b{color:var(--ink);font-weight:500}
.mini .hi{color:var(--accent)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.bd{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted)}
.bd.t{background:var(--cyan-soft);color:var(--cyan)}
.bd.c{background:var(--amber-soft);color:var(--amber)}
.bd.bz{background:var(--accent);color:#fff;font-weight:700}
.bd.id{background:var(--violet);color:#fff;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}

/* workspace */
.ws{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.72);display:flex;align-items:stretch;justify-content:center;padding:20px}
.ws[hidden]{display:none}
.wsbox{background:var(--bg);border-radius:16px;display:grid;grid-template-columns:auto minmax(0,1fr);width:min(1180px,100%);max-height:100%;overflow:hidden}
.wsl{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}
.wsplayer{height:min(78vh,760px);aspect-ratio:9/16;max-width:min(430px,44vw);background:#111;border-radius:10px;overflow:hidden;position:relative}
.wsplayer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wsnav{display:flex;gap:8px;align-items:center;color:#fff;font-size:12px}
.wsnav button{background:#222;color:#fff;border-color:#333}
.wsnav a{color:#9fdde6}
.wsr{overflow:auto;padding:18px 20px 30px;display:grid;gap:14px;align-content:start}
.wsh{display:flex;gap:10px;align-items:flex-start}
.wsh .who{font-size:16px;flex:1}
.cap{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:var(--surface);border-radius:8px;padding:6px 8px}
.stat b{display:block;font-family:var(--f-num);font-size:13px;font-weight:500}
.stat span{font-size:10px;color:var(--muted)}
.stat.hi b{color:var(--accent)}
.sec{display:grid;gap:6px}
.sec>h3{margin:0;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.opts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.grp{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:start}
.grp>span{font-size:11px;color:var(--muted);padding-top:3px}
.op{font-size:12px;padding:2px 10px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted)}
.op.on{border-style:solid;font-weight:700}
.op.t.on{background:var(--cyan-soft);color:var(--cyan);border-color:var(--cyan)}
.op.c.on{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.addin{width:110px;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:transparent}
textarea.memo{font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:110px;resize:vertical;width:100%}
details.box{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.box>summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.box[open]>summary::after{transform:rotate(180deg)}
.boxin{padding:0 12px 12px;display:grid;gap:8px}
.adh{display:flex;gap:6px}
.adh input{flex:1;min-width:0;font-weight:700;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.adh button,.foot button{font-size:11.5px;padding:3px 9px;color:var(--muted)}
.ad textarea{width:100%;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:120px;resize:vertical}
.adadd{font-size:12.5px;padding:7px;border-style:dashed;color:var(--muted);background:transparent}
.cm ol{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.cm li{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:12.5px;line-height:1.5}
.lk{font-family:var(--f-num);font-size:11px;color:var(--accent);background:var(--bg);border-radius:4px;padding:1px 6px;white-space:nowrap;align-self:start}
.at{font-size:10.5px;color:var(--muted)}
.yes{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
.saved{font-size:11px;color:var(--ok)}
.close{font-size:18px;line-height:1;padding:4px 10px}
.ftoggle,.mclose{display:none}
@media (max-width:700px){
  .top{position:static;padding:10px 12px;gap:6px}
  h1{font-size:18px}
  #urls{height:36px;min-width:0}
  .ftoggle{display:block;font-size:12.5px;padding:6px 12px;justify-self:start}
  .ftoggle.active{border-color:var(--ink);font-weight:700}
  .filters{display:none;gap:8px}
  .filters.open{display:grid}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px 8px 40px}
  .tb{padding:8px}
  .who{font-size:12px}
  .mini{gap:6px;font-size:10.5px;flex-wrap:wrap}
  .bd{font-size:10px;padding:1px 6px}
  .pv .cv{font-size:12px;padding:10px}
}
.filters{display:grid;gap:8px}
@media (max-width:700px){.filters{display:none}.filters.open{display:grid}}
@media (max-width:860px){
  .mclose{display:block;align-self:flex-end;background:#222;color:#fff;border-color:#333;font-size:13px;padding:5px 12px}
  .ws{padding:0}
  .wsbox{grid-template-columns:1fr;border-radius:0;overflow:auto}
  .wsl{padding:8px;position:sticky;top:0;z-index:3;flex-direction:row;flex-wrap:wrap;justify-content:center}
  .wsplayer{height:44vh;max-width:none}
  .wsnav{width:100%;justify-content:center}
  .mclose{position:absolute;right:8px;top:8px;z-index:4}
  .wsr{overflow:visible}
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="row"><h1>UGC<span>バズ</span>帳</h1><span class="count" id="count"></span><span class="spacer"></span><span class="sync" id="sync"><i></i><span>この端末に保存</span></span></div>
  <div class="row"><textarea id="urls" placeholder="TikTokのURLを貼り付け（複数行・LINEのコピペのままでOK）"></textarea><button class="main" id="add">追加</button></div>
  <div class="row"><input id="q" type="search" placeholder="キャプション・メモ・案件名・コメント・アカウントで検索">
    <select id="sort"><option value="added">追加が新しい順</option><option value="plays">再生数順</option><option value="save">保存率順</option><option value="share">シェア率順</option><option value="like">いいね率順</option><option value="memo">メモ未記入を先に</option></select></div>
  <button class="ftoggle" id="ftoggle" aria-expanded="false">絞り込み</button>
  <div class="filters" id="filters"><div class="row"><span class="flabel">タグ</span><span class="row" id="ftags"></span></div>
  <div class="row"><span class="flabel">商材</span><span class="row" id="fcats"></span><select id="catSel" aria-label="商材を細かく絞り込む"></select><span class="spacer"></span><button class="chip" id="showDel">削除した動画</button></div></div>
  <div class="msg" id="msg"></div>
</header>
<main class="grid" id="grid"></main>

<div class="ws" id="ws" hidden>
  <div class="wsbox">
    <div class="wsl"><button class="mclose" id="mclose" aria-label="閉じる">× 閉じる</button><div class="wsplayer" id="wsplayer"></div>
      <div class="wsnav"><button id="prev" aria-label="前の動画">←</button><span id="pos"></span><button id="next" aria-label="次の動画">→</button><a id="open" target="_blank" rel="noopener">TikTokで開く</a></div></div>
    <div class="wsr" id="wsr"></div>
  </div>
</div>
<datalist id="projects"></datalist>

const pct=(a,b)=>(a==null||!b)?null:a/b*100, fp=v=>v==null?"—":v.toFixed(v<1?2:1)+"%";
const rt=r=>({like:pct(r.likes,r.plays),save:pct(r.saves,r.plays),share:pct(r.shares,r.plays)});
function say(t){$("#msg").textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$("#msg").textContent="",6000)}
function setSync(state,text){const s=$("#sync");s.className="sync "+state;s.querySelector("span").textContent=text}

// ===== データ =====
let rows;
try{rows=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(rows))rows=SEED.map(r=>({...r}));
function normalize(r){
  if(!r.id)r.id=r.videoId||r.url;
  if(r.videoId&&String(r.id)!==String(r.videoId)&&!rows.some(x=>x!==r&&x.id===r.videoId))r.id=String(r.videoId); // IDを動画IDに統一
  if(!Array.isArray(r.adIdeas))r.adIdeas=r.adMemo&&r.adMemo.trim()?[{project:"",memo:r.adMemo}]:[];
  delete r.adMemo;
  r.tags=r.tags||[];r.cats=r.cats||[];r.buzzMemo=r.buzzMemo||"";
  const b=r.videoId&&BUILTIN[r.videoId];

rows.forEach(normalize);

cache();
const byId=id=>rows.find(r=>String(r.id)===String(id));

// ===== 同期（Googleスプレッドシート） =====
const pending=new Map(); // id -> {fields, timer}
const editingAt=new Map(); // id -> last local edit time
async function api(body){
  const res=await fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j=await res.json(); if(!j.ok)throw new Error(j.error||"error"); return j;
}
function patch(id,fields){
  const r=byId(id);Object.assign(r,fields);cache();editingAt.set(id,Date.now());

  const p=pending.get(id)||{fields:{}};Object.assign(p.fields,fields);clearTimeout(p.timer);

  p.timer=setTimeout(async()=>{pending.delete(id);try{await api({op:"patch",id,fields:p.fields});setSync("ok","共有中・保存済み")}catch(e){setSync("err","保存に失敗。再試行します");const q=pending.get(id)||{fields:{}};Object.assign(q.fields,p.fields,q.fields);pending.set(id,q);setTimeout(()=>patch(id,{}),5000)}},700);
  pending.set(id,p);
}
function sameJSON(a,b){return JSON.stringify(a)===JSON.stringify(b)}
async function pull(first){
  if(!SYNC_URL)return;
  try{
    const res=await fetch(SYNC_URL+"?t="+Date.now());const j=await res.json();if(!j.ok)throw 0;
    // 初回：この端末のデータをシートへ移す（シートに既にある項目は上書きしない）
    if(first&&!localStorage.getItem(MIGRATED)){
      const have=new Set(j.rows.map(r=>String(r.id)));
      const send=rows.filter(r=>!r.deleted);
      if(send.length){setSync("busy","この端末のデータを共有シートへ移行中…");
        for(let i=0;i<send.length;i+=15)await api({op:"import",rows:send.slice(i,i+15)});}
      try{localStorage.setItem(MIGRATED,String(Date.now()))}catch(e){}
      return pull(false);
    }
    let changed=false;
    const map=new Map(rows.map(r=>[String(r.id),r]));
    for(const s of j.rows){
      const id=String(s.id);normalize(s);
      const l=map.get(id);
      const busy=pending.has(id)||(Date.now()-(editingAt.get(id)||0)<4000);
      if(!l){rows.push(s);changed=true;continue}
      if(busy)continue;
      if(!sameJSON(l,s)){Object.keys(l).forEach(k=>delete l[k]);Object.assign(l,s);changed=true}
    }
    cache();
    setSync("ok","共有中・"+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+" 更新");
    if(changed||first){renderGrid();if(curId&&!$("#wsr").contains(document.activeElement))renderWs()}
  }catch(e){setSync("err","共有シートに接続できません（この端末には保存中）")}
}

let ftag=new Set(),fgroup=null,fcat="",showDeleted=false;

  if(fcat)v=v.filter(r=>r.cats.includes(fcat));
  if(q)v=v.filter(r=>[r.author,r.nickname,r.caption,r.buzzMemo,adText(r),r.cats.join(" "),(r.top?.c||[]).map(x=>x[1]).join(" "),r.tags.join(" ")].join(" ").toLowerCase().includes(q));
  const s=$("#sort").value,k={plays:r=>+r.plays||0,save:r=>rt(r).save||0,share:r=>rt(r).share||0,like:r=>rt(r).like||0};
  if(k[s])v.sort((a,b)=>k[s](b)-k[s](a));
  else if(s==="memo")v.sort((a,b)=>(!!(a.buzzMemo||adText(a).trim()))-(!!(b.buzzMemo||adText(b).trim()))||(b.addedAt||0)-(a.addedAt||0));
  else v.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));

function renderFilters(){

function tileBody(r){
  const x=rt(r);const memo=!!r.buzzMemo, ads=(r.adIdeas||[]).filter(a=>a.project||a.memo).length;
  return `<div class="who">${r.author?"@"+esc(r.author):`<span style="color:var(--muted);font-weight:400">データ未取得</span>`}<small>${esc(r.nickname||"")}</small></div>
  ${r.plays?`<div class="mini"><span><b>${fmt(r.plays)}</b> 再生</span><span class="${x.save>=1?"hi":""}">保存 <b>${fp(x.save)}</b></span></div>`:""}
  <div class="badges">${r.tags.map(t=>`<span class="bd t">${esc(t)}</span>`).join("")}${[...new Set(r.cats.map(c=>CAT_GROUP[c]||"その他"))].map(g=>`<span class="bd c">${esc(g)}</span>`).join("")}${memo?`<span class="bd bz">バズメモ</span>`:""}${ads?`<span class="bd id">案件アイデア ${ads}件</span>`:""}</div>`;
}
function capText(r){return (r.caption||"").replace(/#\S+/g,"").trim()||(r.author?"@"+r.author:"")}
function renderGrid(){
  renderFilters();
  const v=visible();
  $("#count").textContent=`${rows.filter(r=>!r.deleted).length}本`+(v.length!==rows.filter(r=>!!r.deleted===showDeleted).length?` ／ 表示 ${v.length}本`:"");
  const ids=v.map(r=>String(r.id));
  const grid=$("#grid");
  if(sameJSON(ids,order)&&grid.children.length===ids.length){
    v.forEach((r,i)=>{const t=grid.children[i];const h=tileBody(r);if(t._h!==h){t.querySelector(".tb").innerHTML=h;t._h=h}t.classList.toggle("deleted",!!r.deleted)});
    return;
  }
  order=ids;
  if(!v.length){grid.innerHTML=`<div class="empty">${showDeleted?"削除した動画はありません。":rows.length?"条件に合う動画がありません。":"上の欄にTikTokのURLを貼って「追加」してください。"}</div>`;setupPreviews();return}
  grid.innerHTML=v.map(r=>`<article class="tile${r.deleted?" deleted":""}" data-id="${esc(r.id)}"><div class="pv" data-vid="${esc(r.videoId||"")}"><div class="cv">${esc(capText(r))}</div>${r.videoId?`<div class="wait">プレビュー待ち…</div>`:""}<button class="hit" aria-label="開く"></button></div><div class="tb">${tileBody(r)}</div></article>`).join("");
  [...grid.children].forEach(t=>t._h=t.querySelector(".tb").innerHTML);
  setupPreviews();
}

// プレビュー：画面に入った動画を1本ずつ間隔をあけて読み込む（一度に読むとTikTokにブロックされる）
let io,queue=[],busy=false,loaded=[];
const MAX_LOADED=10,GAP=2500;
function setupPreviews(){
  io&&io.disconnect();queue=[];loaded=[];
  io=new IntersectionObserver(es=>es.forEach(e=>{const p=e.target;p._vis=e.isIntersecting;if(e.isIntersecting&&!p.dataset.loaded&&!queue.includes(p)){queue.push(p);pump()}}),{rootMargin:"200px 0px"});
  document.querySelectorAll(".pv[data-vid]").forEach(p=>{if(p.dataset.vid)io.observe(p)});
}
async function pump(){
  if(busy)return;busy=true;
  while(queue.length){
    const p=queue.shift();
    if(!p.isConnected||p.dataset.loaded||!p._vis)continue;
    loaded=loaded.filter(x=>x.isConnected);
    while(loaded.length>=MAX_LOADED){const old=loaded.find(x=>!x._vis);if(!old)break;old.querySelector("iframe")?.remove();delete old.dataset.loaded;loaded=loaded.filter(x=>x!==old)}
    const f=document.createElement("iframe");f.src=`https://www.tiktok.com/player/v1/${p.dataset.vid}?description=0&music_info=0&controls=0&progress_bar=0&play_button=0&volume_control=0&fullscreen_button=0&timestamp=0&loop=0&closed_caption=0`;f.tabIndex=-1;
    p.insertBefore(f,p.querySelector(".hit"));p.dataset.loaded="1";loaded.push(p);
    await new Promise(res=>{let d=0;const fin=()=>{if(!d){d=1;res()}};f.addEventListener("load",fin);setTimeout(fin,6000)});
    await new Promise(res=>setTimeout(res,GAP));
  }
  busy=false;
}

// ===== 編集画面（動画の横で編集） =====
let curId=null;
function openWs(id){curId=String(id);$("#ws").hidden=false;document.body.style.overflow="hidden";renderWs(true)}
function closeWs(){curId=null;$("#ws").hidden=true;$("#wsplayer").innerHTML="";document.body.style.overflow=""}
function step(d){const v=visible();const i=v.findIndex(r=>String(r.id)===curId);const n=v[i+d];if(n){curId=String(n.id);renderWs(true)}}
function renderWs(withPlayer){
  const r=byId(curId);if(!r){closeWs();return}
  const v=visible();const i=v.findIndex(x=>String(x.id)===curId);
  $("#pos").textContent=i>=0?`${i+1} / ${v.length}`:"";
  $("#prev").disabled=i<=0;$("#next").disabled=i<0||i>=v.length-1;
  $("#open").href=r.author&&r.videoId?`https://www.tiktok.com/@${r.author}/video/${r.videoId}`:r.url;
  if(withPlayer)$("#wsplayer").innerHTML=r.videoId?`<iframe src="https://www.tiktok.com/player/v1/${r.videoId}?autoplay=1&description=0&music_info=0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>`:`<div style="color:#fff;padding:20px">動画IDが取れていません。「TikTokで開く」から見てください。</div>`;
  const x=rt(r);
  const open=JSON.parse(sessionStorage.getItem("ws-open")||"{}");
  const ads=r.adIdeas||[];
  $("#wsr").innerHTML=`
  <div class="wsh"><div class="who">${r.author?"@"+esc(r.author):"データ未取得"}<small>${esc(r.nickname||"")}${r.postedAt?" ・ 投稿 "+new Date(r.postedAt*1000).toLocaleDateString("ja-JP"):""}</small></div><span class="saved" id="saved"></span><button class="close" id="wsclose" aria-label="閉じる">×</button></div>
  ${r.caption?`<div class="cap">${esc(r.caption)}</div>`:""}
  ${r.plays?`<div class="stats"><div class="stat"><b>${fmt(r.plays)}</b><span>再生</span></div><div class="stat"><b>${fp(x.like)}</b><span>いいね率</span></div><div class="stat ${x.save>=1?"hi":""}"><b>${fp(x.save)}</b><span>保存率</span></div><div class="stat ${x.share>=0.5?"hi":""}"><b>${fp(x.share)}</b><span>シェア率</span></div><div class="stat"><b>${r.duration?r.duration+"秒":"—"}</b><span>尺</span></div></div>`:`<div class="cap">再生数などはまだ取得していません（Claudeに「データ更新して」と依頼）</div>`}
  <div class="sec"><h3>出演者の関係性（タグ）</h3><div class="opts">${[...new Set([...TAGS,...r.tags])].map(t=>`<button class="op t ${r.tags.includes(t)?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}<input class="addin" data-addtag placeholder="＋タグ"></div></div>
  <div class="sec"><h3>使えそうな商材</h3>${Object.entries(CATS).map(([g,a])=>`<div class="grp"><span>${g}</span><div class="opts">${a.map(c=>`<button class="op c ${r.cats.includes(c)?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>`).join("")}
    <div class="grp"><span>その他</span><div class="opts">${r.cats.filter(c=>!CAT_GROUP[c]).map(c=>`<button class="op c on" data-cat="${esc(c)}">${esc(c)} ×</button>`).join("")}<input class="addin" data-addcat placeholder="＋自由入力"></div></div></div>
  <div class="sec"><h3>UGCバズの要因</h3><textarea class="memo" id="buzz" placeholder="冒頭のフック、関係性、オチ、コメント欄の反応など">${esc(r.buzzMemo)}</textarea></div>
  <div class="sec"><h3>広告に使うなら（案件別）</h3>
    ${ads.map((a,k)=>`<details class="box ad" data-i="${k}" ${open[curId+":"+k]!==false?"open":""}><summary><span>${esc(a.project||"案件名未入力")}</span></summary><div class="boxin"><div class="adh"><input list="projects" data-ap="project" value="${esc(a.project)}" placeholder="案件名（例：サミナス）"><button data-addel>削除</button></div><textarea data-ap="memo" placeholder="差し込み方、キャスト条件、尺、CTAなど">${esc(a.memo)}</textarea></div></details>`).join("")}
    <button class="adadd" data-adadd>＋ 案件を追加</button></div>
  ${r.top?(r.top.c.length?`<details class="box cm" ${open.cm!==false?"open":""} data-cm><summary><span>トップコメント <span style="font-weight:400;color:var(--muted)">全${(r.top.n||0).toLocaleString()}件中・いいね順</span></span></summary><div class="boxin"><ol>${r.top.c.map(([l,t])=>`<li><span class="lk">♥ ${fmt(l)}</span><span>${esc(t)}</span></li>`).join("")}</ol><div class="at">${esc(r.top.at||"")} 時点</div></div></details>`:`<div class="cap">コメントなし（オフの可能性）</div>`):""}
  <div class="foot row">${r.deleted?`<button data-restore>元に戻す</button>`:`<button data-del>この動画を削除</button>`}</div>`;
}
function flash(){const s=$("#saved");if(s){s.textContent=SYNC_URL?"保存しました":"この端末に保存";clearTimeout(flash.t);flash.t=setTimeout(()=>{if($("#saved"))$("#saved").textContent=""},1500)}}
$("#wsr").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const r=byId(curId);
  if(b.id==="wsclose")return closeWs();
  if(b.dataset.tag){const s=new Set(r.tags);s.has(b.dataset.tag)?s.delete(b.dataset.tag):s.add(b.dataset.tag);patch(r.id,{tags:[...s]});renderWs();renderGrid();flash();return}
  if(b.dataset.cat){const s=new Set(r.cats);s.has(b.dataset.cat)?s.delete(b.dataset.cat):s.add(b.dataset.cat);patch(r.id,{cats:[...s]});renderWs();renderGrid();flash();return}
  if(b.hasAttribute("data-adadd")){patch(r.id,{adIdeas:[...(r.adIdeas||[]),{project:"",memo:""}]});renderWs();const ins=$("#wsr").querySelectorAll(".adh input");ins[ins.length-1]?.focus();return}
  if(b.hasAttribute("data-addel")){const k=+b.closest(".ad").dataset.i,a=r.adIdeas[k];
    if((a.project||a.memo)&&b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="本当に削除";b.classList.add("yes");return}
    const n=[...r.adIdeas];n.splice(k,1);patch(r.id,{adIdeas:n});renderWs();renderGrid();return}
  if(b.hasAttribute("data-del")){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="本当に削除する（後で元に戻せます）";b.classList.add("yes");return}
    patch(r.id,{deleted:true});if(SYNC_URL)api({op:"delete",id:r.id}).catch(()=>{});say("削除しました。「削除した動画」から元に戻せます");const v=visible();closeWs();renderGrid();return}
  if(b.hasAttribute("data-restore")){patch(r.id,{deleted:false});if(SYNC_URL)api({op:"restore",id:r.id}).catch(()=>{});say("元に戻しました");renderWs();renderGrid();return}
});
$("#wsr").addEventListener("input",e=>{
  const t=e.target,r=byId(curId);
  if(t.id==="buzz"){patch(r.id,{buzzMemo:t.value});flash();clearTimeout(t._g);t._g=setTimeout(renderGrid,800);return}
  if(t.dataset.ap){const k=+t.closest(".ad").dataset.i;const n=r.adIdeas.map(a=>({...a}));n[k][t.dataset.ap]=t.value;patch(r.id,{adIdeas:n});flash();
    if(t.dataset.ap==="project")t.closest("details").querySelector("summary span").textContent=t.value||"案件名未入力";clearTimeout(t._g);t._g=setTimeout(renderGrid,800)}
});
$("#wsr").addEventListener("keydown",e=>{
  const t=e.target;if(e.key!=="Enter"||e.isComposing)return;const v=t.value?.trim();if(!v)return;const r=byId(curId);
  if(t.hasAttribute("data-addtag")){if(!r.tags.includes(v))patch(r.id,{tags:[...r.tags,v]});renderWs();renderGrid();$("#wsr [data-addtag]")?.focus()}
  if(t.hasAttribute("data-addcat")){if(!r.cats.includes(v))patch(r.id,{cats:[...r.cats,v]});renderWs();renderGrid();$("#wsr [data-addcat]")?.focus()}
});
$("#wsr").addEventListener("toggle",e=>{const d=e.target;if(!d.classList?.contains("box"))return;const o=JSON.parse(sessionStorage.getItem("ws-open")||"{}");if(d.hasAttribute("data-cm"))o.cm=d.open;else o[curId+":"+d.dataset.i]=d.open;try{sessionStorage.setItem("ws-open",JSON.stringify(o))}catch(x){}},true);
$("#ws").addEventListener("click",e=>{if(e.target.id==="ws")closeWs()});
$("#prev").addEventListener("click",()=>step(-1));$("#next").addEventListener("click",()=>step(1));
document.addEventListener("keydown",e=>{if($("#ws").hidden)return;const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);if(e.key==="Escape"){typing?document.activeElement.blur():closeWs()}else if(!typing&&e.key==="ArrowLeft")step(-1);else if(!typing&&e.key==="ArrowRight")step(1)});

// ===== 一覧の操作 =====
$("#grid").addEventListener("click",e=>{const t=e.target.closest(".tile");if(t)openWs(t.dataset.id)});
$("#ftags").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ftag.has(b.dataset.ft)?ftag.delete(b.dataset.ft):ftag.add(b.dataset.ft);renderGrid()});
$("#fcats").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.hasAttribute("data-clear")){ftag.clear();fgroup=null;fcat=""}else fgroup=fgroup===b.dataset.fg?null:b.dataset.fg;renderGrid()});
$("#catSel").addEventListener("change",e=>{fcat=e.target.value;renderGrid()});
$("#ftoggle").addEventListener("click",()=>{const f=$("#filters");f.classList.toggle("open");$("#ftoggle").setAttribute("aria-expanded",f.classList.contains("open"))});
$("#mclose").addEventListener("click",()=>closeWs());
$("#showDel").addEventListener("click",()=>{showDeleted=!showDeleted;renderGrid()});
$("#q").addEventListener("input",renderGrid);$("#sort").addEventListener("change",renderGrid);
$("#add").addEventListener("click",async()=>{
  const found=[...new Set($("#urls").value.match(/https?:\/\/[^\s<>"']*tiktok\.com\/[^\s<>"']+/g)||[])];
  if(!found.length){say("TikTokのURLが見つかりませんでした。");return}
  $("#add").disabled=true;let n=0,dup=0,miss=0;const added=[];
  for(const u of found){
    let vid=(u.match(/\/video\/(\d+)/)||[])[1]||null,author=(u.match(/@([\w.\-]+)/)||[])[1]||null;
    if(!vid){try{const j=await(await fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(u))).json();vid=j.embed_product_id||null}catch(e){}}
    if(!vid){miss++;continue}
    const ex=rows.find(r=>r.url===u||String(r.videoId)===vid);
    if(ex){if(ex.deleted){patch(ex.id,{deleted:false});if(SYNC_URL)api({op:"restore",id:ex.id}).catch(()=>{});n++}else dup++;continue}
    const r=normalize({id:vid,url:u,videoId:vid,author,caption:"",tags:[],cats:[],buzzMemo:"",adIdeas:[],status:"ok",addedAt:Date.now()+n});
    rows.push(r);added.push(r);n++;
  }
  cache();$("#urls").value="";$("#add").disabled=false;$("#sort").value="added";renderGrid();
  if(SYNC_URL&&added.length){try{await api({op:"add",rows:added});setSync("ok","共有中・保存済み")}catch(e){setSync("err","共有シートに追加できませんでした。後で再送します");localStorage.removeItem(MIGRATED)}}
  say(`${n}本追加しました`+(dup?`（重複${dup}本はスキップ）`:"")+(miss?`。${miss}本は動画IDが取れませんでした`:"")+(added.some(r=>!r.plays)?"。再生数などはClaudeに「データ更新して」と頼むと入ります":""));
});

renderGrid();
if(SYNC_URL){setSync("busy","共有シートに接続中…");pull(true);setInterval(()=>{if(!document.hidden)pull(false)},10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull(false)})}
</script>
